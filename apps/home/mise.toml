[tools]
node = "24"
pnpm = "12.8.1"

[tasks."setup"]
description = "Setup NextJS Documentation Site"
run = [
  "pnpm install",
  # "pnpm exec next telemetry disable" # Should be enabled somehow. Disabled for right now because this command needs the source code before being ran, which is not yet done in release.yml workflow and Dockerfile.
]

[tasks."dev"]
description = "Run NextJS Dev Server"
run = "trap 'exit 0' INT TERM; pnpm --filter . dev"

[tasks."test"]
description = "Run tests for NextJS"
run = "pnpm exec vitest run --passWithNoTests"
