[project]
name = "ironbook"
version = "0.1.3-alpha"
description = "A Digital Dinancial Ledger"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "django==5.2.17",
    "django-cors-headers==4.9.0",
    "django-environ==0.13.0",
    "django-tailwind[cookiecutter,honcho,reload]==4.4.2",
    "djangorestframework==3.18.2",
    "honcho==2.0.0",
    "whitenoise==6.12.0",
    "sqlparse==0.6.0",
    "uvicorn==0.54.0",
    "urllib3==2.8.0",
    "certifi==2026.10.18",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pyright]
reportAssignmentType= "error"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ironbook.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--no-migrations",  # Skips running migrations during test DB setup for speed
    "--reuse-db",        # Reuses test DB across runs for much faster local execution
]
