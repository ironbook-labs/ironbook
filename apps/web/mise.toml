[tools]
"github:astral-sh/uv" = "0.11.14"

[env]
_.python.venv = "{{config_root}}/.venv"

[tasks."setup"]
description = "Setup Django Web Client"
run = "uv sync && uv run python manage.py collectstatic --no-input && uv run python manage.py tailwind build"

[tasks."dev"]
description = "Run Django Dev Server"
depends = ["misc:django-free-port"]
run = "trap 'exit 0' INT TERM; python manage.py tailwind dev"

[tasks."misc:django-free-port"]
description = "Kill any process clinging onto port 8080"
run = """
if lsof -t -i:8080 > /dev/null; then
  echo "Found a zombie process on port 8080. Terminating..."
  kill -9 $(lsof -t -i:8080)
  echo "Port 8080 is now free!"
else
  echo "Port 8080 is already clear."
fi
"""

[tasks."test"]
description = "Run Django Tests"
run = "uv run pytest"
