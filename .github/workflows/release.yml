name: Build & Publish All Releases

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- SETUP ENVIRONMENT ---
      - name: Set up mise environment
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run project setup script
        run: scripts/ironbook.sh setup --no-docker --no-project-setup --no-git-hooks --no-pre-commit-test

      - name: Manually download dependencies for home and android
        run: |
            mise run //apps/home:setup
            mise run //apps/android:setup

      # --- IMPORT SECRETS ---
      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Decode Android Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "$ENCODED_STRING"

          printf '%s' "$ENCODED_STRING" \
            | base64 --decode > apps/android/ironbook.keystore

          test -s apps/android/ironbook.keystore

          echo "Keystore decoded successfully."

      - name: Diagnose Android Signing Environment
        env:
          KEYSTORE_PATH: apps/android/ironbook.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "::group::1. Environment"

          echo "Runner OS: $RUNNER_OS"
          echo "Java:"
          mise exec -- java -version 2>&1

          echo "Gradle:"
          cd apps/android
          mise exec -- ./gradlew --version

          echo "Android SDK:"
          echo "ANDROID_HOME=${ANDROID_HOME:-NOT SET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-NOT SET}"

          echo "::endgroup::"

          echo "::group::2. Secret availability"

          test -n "$KEYSTORE_PASSWORD" \
            && echo "KEYSTORE_PASSWORD: present" \
            || { echo "KEYSTORE_PASSWORD: MISSING"; exit 1; }

          test -n "$KEY_ALIAS" \
            && echo "KEY_ALIAS: present" \
            || { echo "KEY_ALIAS: MISSING"; exit 1; }

          test -n "$KEY_PASSWORD" \
            && echo "KEY_PASSWORD: present" \
            || { echo "KEY_PASSWORD: MISSING"; exit 1; }

          echo "::endgroup::"

          echo "::group::3. Keystore file"

          echo "Path: $KEYSTORE_PATH"
          ls -lh "$KEYSTORE_PATH"
          file "$KEYSTORE_PATH"
          sha256sum "$KEYSTORE_PATH"

          echo "::endgroup::"

          echo "::group::4. Keystore password validation"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Keystore password accepted."

          echo "::endgroup::"

          echo "::group::5. Alias validation"

          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Alias successfully found."

          echo "::endgroup::"

          echo "::group::6. Private key password validation"

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/ironbook-signing-test.csr"

          rm -f "$RUNNER_TEMP/ironbook-signing-test.csr"

          echo "Private key password accepted."

          echo "::endgroup::"

      # --- BUILD ---
      - name: Build Release
        env:
          RELEASE_GPG_KEY: ${{ steps.import_gpg.outputs.fingerprint }}
          KEYSTORE_PATH: "ironbook.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: scripts/ironbook.sh release "${GITHUB_REF_NAME#v}"

      # --- PUBLISH ---
      - name: Upload All Release Assets
        uses: softprops/action-gh-release@v3
        with:
          working_directory: output
          files: |
            android/*.zip
            android/*.zip.asc
            api/linux/*.zip
            api/linux/*.zip.asc
            api/windows/*.zip
            api/windows/*.zip.asc
            desktop/linux/*.zip
            desktop/linux/*.zip.asc
            desktop/windows/*.zip
            desktop/windows/*.zip.asc
            home/*.zip
            home/*.zip.asc
            installer/*.zip
            installer/*.zip.asc
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: output/"${GITHUB_REF_NAME#v}"*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
